<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .welcome {
            text-align: center;
            margin-top: 25vh;
            color: #aaa;
        }

        .welcome h1 {
            color: white;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 15px;
            line-height: 1.4;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        .ai {
            background: #242424;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #333;
            background: #151515;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #292929;
            color: white;
            outline: none;
            font-size: 16px;
        }

        button {
            margin-left: 10px;
            width: 50px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        ⚡ Lightning AI
    </header>

    <div class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h1>⚡ Lightning AI</h1>
            <p>How can I help you today?</p>
        </div>
    </div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="Message Lightning AI..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("messageInput");
            const chat = document.getElementById("chat");
            const welcome = document.getElementById("welcome");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            if (welcome) {
                welcome.remove();
            }

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = message;
            chat.appendChild(userMessage);

            input.value = "";

            const aiMessage = document.createElement("div");
            aiMessage.className = "message ai";
            const aiMessage = document.createElement("div");
aiMessage.className = "message ai";
chat.appendChild(aiMessage);

aiMessage.textContent = "Thinking... ⚡";
            chat.appendChild(aiMessage);

            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("messageInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
